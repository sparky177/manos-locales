<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi emprendimiento · Manos Locales</title>
  <link rel="icon" href="/assets/marca.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/paneles.css">
</head>
<body data-pagina="panel-emprendedor">
  <header class="cabecera">
    <div class="contenedor barra">
      <a class="marca" href="/"><img src="/assets/marca.svg" alt="">Manos Locales</a>
      <nav aria-label="Principal">
        <a href="/">Catálogo</a>
        <a href="/html/panel-emprendedor.html" aria-current="page">Mi emprendimiento</a>
        <a href="/html/cuenta.html">Mi cuenta</a>
        <button id="salir" hidden>Salir</button>
      </nav>
    </div>
  </header>
  <main class="contenedor">
    <p role="status" id="aviso"></p>
    <h1>Mi emprendimiento</h1>
    <p id="identidad"></p>
    <p id="estado" role="status"></p>
    <section class="caja" hidden id="perfil">
      <h2>Datos del emprendimiento</h2>
      <form id="negocio">
        <label>Nombre comercial<input name="nombre" required maxlength="80"></label>
        <label>Descripción<textarea name="descripcion" maxlength="500" required></textarea></label>
        <label>Localidad de Santa Cruz<input name="localidad" required maxlength="80"></label>
        <label>WhatsApp comercial con código de país<input name="whatsapp" required inputmode="numeric" pattern="[1-9][0-9]{7,14}" placeholder="549…" aria-describedby="ayuda-whatsapp"></label>
        <span id="ayuda-whatsapp">Para un celular argentino, ingresá 549, el código de área sin 0 y el número sin 15.</span>
        <button id="guardarPerfil">Enviar solicitud</button>
      </form>
    </section>
    <section class="caja" hidden id="gestion">
      <h2 id="tituloProducto">Publicar producto</h2>
      <form id="producto">
        <label>Nombre<input name="nombre" required maxlength="80"></label>
        <label>Descripción<textarea name="descripcion" maxlength="500" required></textarea></label>
        <div class="campos">
          <label>Precio en pesos<input name="precio" required type="number" min="0.01" step="0.01"></label>
          <label>Stock en unidades<input name="stock" required type="number" min="0" max="99999" step="1"></label>
          <label>Categoría<select id="categorias" name="categoria"></select></label>
        </div>
        <label>Imagen de la galería<select id="imagenes" name="imagen"></select></label>
        <img id="muestra" class="mini" alt="Imagen seleccionada">
        <button id="guardarProducto">Publicar</button>
        <button type="button" id="cancelar" hidden>Cancelar edición</button>
      </form>
      <h2>Mis productos</h2>
      <div id="inventario"></div>
    </section>
  </main>
  <footer><div class="contenedor">Manos Locales <span>· Santa Cruz, Argentina</span></div></footer>
  <script type="module" src="/js/inicio.js"></script>
</body>
</html>
